# fly.toml app configuration file generated for fieldsync-api on 2026-10-31T07:06:40Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fieldsync-api'
primary_region = 'ord'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy --schema apps/api/prisma/schema.prisma'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
