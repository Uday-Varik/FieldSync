services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync_dev_only
      POSTGRES_DB: fieldsync
    ports:
      - "5432:5432"
    volumes:
      - fieldsync_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - fieldsync_redisdata:/data

volumes:
  fieldsync_pgdata:
  fieldsync_redisdata:
